[tooltip]
default.value = Valore attuale: {0} (predefinito: {1})
perf.effect.low = Non ha effetto sulle prestazioni.
perf.effect.mid = Ha un leggero effetto sulle prestazioni.
perf.effect.high = Ha molto effetto sulle prestazioni.
cantchange = Questa opzione non può essere modificata in gioco.
fullscreen = Questa opzione avrà effetto solo in schermo intero.
achipop = Mostra una notifica popup quando si sblocca un achievement.
bar = Rende il movimento delle barre più fluido.
default.value.fov = Valore attuale: %s° (predefinito: 60°)
default.value.0 = Valore attuale: %s% (predefinito: 0%)
default.value.100 = Valore attuale: %s% (predefinito: 100%)
subtitles.note = Non disponibili in questa versione!
txtshadow = Mostra un effetto ombra sui testi.
frame = Limita i frame alla quale il gioco girerà al valore desiderato.
frame.note = Di solito si consigliano 60 FPS o più. Se noti eccessivo stutter con queste impostazioni, prova ad abbassare il tuo framerate per renderlo più costante.
gamma = La "correzione della gamma" viene utilizzata per ottenere un buon fattore di luminosità che bilancia la gamma del display se il gioco appare troppo scuro o troppo chiaro. Impostandola su un valore troppo alto o troppo basso, la grafica potrebbe apparire meno dettagliata.
fov = Il "campo visivo" è la porzione di gioco visualizzata durante una partita.
particle_1 = Determina la quantità di particelle che possono essere renderizzate per tick.
particle_2.1 = Solo gli emettitori di fumo produrranno particelle.
particle_2.2 = Verranno renderizzate solo poche particelle per tick.
particle_2.3 = Tutte le particelle vengono renderizzate.
lightingquality = Regola la qualità dell'illuminazione. Più alta è l'impostazione, più oggetti possono proiettare ombre.
ambientocclusion = L'"occlusione ambientale" aggiunge realismo simulando ombre morbide nelle aree in cui la luce è bloccata, come angoli, fessure e punti di contatto tra oggetti.
texquality = Regola la qualità delle texture.
anisotropic = Il "filtro anisotropico" migliora la qualità dell'immagine delle texture sulle superfici che si trovano ad angoli di visione obliqui rispetto alla telecamera.
renderdistance = Distanza di visualizzazione. Influisce sul clipping delle stanze: minore è la distanza, maggiori sono le prestazioni.
screnderinterval = "Intervallo di rendering della telecamera" modifica la frequenza di aggiornamento del rendering della telecamera di sicurezza. Modificare questa opzione se si riscontrano FPS bassi durante la visualizzazione dei monitor.
alias = L'"anti-aliasing" viene utilizzato per uniformare l'immagine renderizzata prima della visualizzazione, al fine di ridurre l'aliasing attorno ai bordi dei modelli.
vsync = La "sincronizzazione verticale" attende che il display completi il ciclo di aggiornamento corrente prima di calcolare il fotogramma successivo, evitando così problemi quali lo screen tearing. Ciò lega la frequenza dei fotogrammi del gioco alla frequenza di aggiornamento del display e può causare un leggero ritardo nell'input.
bloom = Il "Bloom" simula la diffusione della luce in una fotocamera o nell'occhio umano, creando un bagliore morbido attorno alle fonti di luce intensa.
motionblur = Il "motion blur" è un effetto visivo che simula la sfocatura degli oggetti in rapido movimento o il movimento della telecamera per imitare il modo in cui gli esseri umani percepiscono il movimento nella vita reale, creando un maggiore senso di velocità e realismo.
volumetriclights = L'"illuminazione volumetrica" crea un effetto di luce volumetrica (polvere).
vignette = Mostra/Nascondi l'overlay della vignetta.
highlight = Evidenzia gli oggetti interattivi.
mastervolume = Regola il volume principale dei suoni. Spostando la barra completamente a sinistra, tutti i suoni verranno disattivati.
musicvolume = Regola il volume della musica di sottofondo. Spostando la barra completamente a sinistra, la musica verrà disattivata.
soundvolume = Regola il volume degli effetti sonori. Spostando la barra completamente a sinistra, tutti i suoni ambientali verranno disattivati.
voicevolume = Regola il volume delle voci dei giocatori e dei PNG. Spostando la barra completamente a sinistra, tutte le voci verranno silenziate.
autorelease = La funzione "Rilascio automatico dell'audio" libera un suono dalla memoria se non viene utilizzato dopo 5 secondi. Previene problemi di allocazione della memoria.
usertrack = Attiva/disattiva la possibilità di riprodurre brani personalizzati sul canale 1 della radio. Questi brani vengono caricati dal percorso “SFX\Radio\UserTracks\”. Premere “1” quando la radio è selezionata per cambiare brano.
trackmode = Imposta la modalità di riproduzione per i brani personalizzati. “Ripeti” riproduce tutti i file in ordine alfabetico. “Casuale” seleziona il brano successivo in modo casuale.
modenote = Nota bene che la modalità casuale non impedisce la ripetizione dei brani riprodotti in precedenza.
scantrack = Ricontrolla il percorso delle tracce utente per verificare la presenza di file audio nuovi o rimossi.
cantchangebtn = Questo pulsante non può essere utilizzato durante il gioco.
mousespeed = Regola la velocità del puntatore del mouse.
invertx = "inverti l'asse X del mouse" è autoesplicativo.
inverty = "inverti l'asse Y del mouse" è autoesplicativo.
mousesmooth = Regola il livello di fluidità del puntatore del mouse.
configcontrol = Configura lo schema dei comandi nel gioco.
hud = Mostra gli indicatori di occhi e resistenza.
fpb = Nascondi/Mostra il corpo del giocatore.
console = Attiva/disattiva l'uso della console da sviluppatore. Può essere utilizzata nel gioco premendo "%s".
errorconsole = "Apri la console in caso di errore" è autoesplicativo.
autosave = Crea automaticamente un backup del tuo salvataggio ogni 2 minuti. Premi "%s" per annullare il salvataggio automatico.
autosave.note = Questa opzione funziona solo con il tipo di salvataggio "Salva ovunque".
fps = Visualizza il contatore dei fotogrammi al secondo nell'angolo in alto a sinistra.
startvideo = "Video d'avvio" riproduce i video di avvio all'apertura del gioco.
launcher = "Usa il launcher" è autoesplicativo.
subtitles = Visualizza le finestre di dialogo o le voci attuali in forma testuale.
subtitles.color = "Colore dei sottotitoli" è autoesplicativo.
reset = "Ripristina opzioni" è autoesplicativo.
vram = Le texture memorizzate nella RAM video verranno caricate più velocemente, ma ciò avrà anche effetti negativi sulla qualità delle texture.
atmo = Cambia l'atmosfera tra SCP:CB vanilla e SCP:CB UER. La nuova atmosfera è più confortevole per giocare alla luce del giorno e migliore per realizzare video. Quella vecchia, invece, è più adatta per giocare di notte.
shadows = Attiva/disattiva le ombre blob sotto i PNG, gli oggetti e il giocatore.
lights = Attiva/disattiva l'effetto di riflesso artificiale generato sulle fonti di luce.
bump = Il "bump mapping" viene utilizzato per simulare protuberanze e ammaccature distorcendo le lightmap.
lod = "Distorsione LOD della texture" influisce sulla distanza alla quale i dettagli della texture cambiano per evitare l'aliasing. Modifica questa opzione se le texture sono sfocate o appaiono troppo sfocate.
colorcorrection = La "correzione del colore" è il processo di regolazione dei colori per ottenere l'aspetto desiderato, sia per correggere imprecisioni che per ottenere un effetto stilistico.
ds = Sceglie se il giocatore deve guardare direttamente un oggetto per poterlo raccogliere.
uns = Consente di inserire i semi come numeri interi, che verranno utilizzati per inizializzare direttamente il generatore di numeri casuali interno del gioco. Se non viene inserito alcun seme, viene utilizzato il numero di millisecondi trascorsi dall'avvio del computer.
perf.effect.vid.memory = Richiede più memoria video.
reflectionsquality = Regola la qualità dei riflessi. Determina la risoluzione, il livello di dettaglio e la precisione delle superfici che riflettono la luce (come l'acqua, il vetro o i metalli lucidi).
parallaxocclusion = L'"Occlusione parallax" è una tecnica di rendering 3D ad alte prestazioni che conferisce una profondità notevole e dettagliata alle superfici con texture — come mattoni o ghiaia — senza creare una geometria effettiva.
hdrrender = Il "Rendering ad alta gamma dinamica (HDR)" è una tecnica grafica utilizzata per calcolare l'illuminazione sulla base di una gamma di luminosità e colori molto più ampia. Consente di preservare i minimi dettagli sia nelle ombre più profonde che nelle zone più luminose, imitando il modo in cui l'occhio umano si adatta naturalmente alle diverse condizioni di luce.
shadowsquality = Regola la qualità delle ombre. Più alto è il valore, più lisci e puliti diventeranno i bordi delle ombre.
reflections = Attiva le immagini riflesse come uno specchio su acqua, vetro, metallo e pavimenti lucidi.

[global]
splitwithspace = 1
localizedmanual = 0

[save]
save = Premi %s per salvare.
saved = Progressi di gioco salvati.
disable = Salvataggio rapido disattivato.
imcompatible = I salvataggi della v{0} non sono compatibili con SCP - Containment Breach Ultimate Edition Reborn v{1}.
corrupted_1 = Impossibile caricare la partita, salvataggio corrotto (errore 1).
corrupted_2 = Impossibile caricare la partita, salvataggio corrotto (errore 2).
corrupted_3 = Impossibile caricare la partita, salvataggio corrotto (errore 3).
corrupted_4 = Impossibile caricare la partita, salvataggio corrotto (errore 4).
autosave.in = Autosalvataggio tra: %s...
autosave.canceled = Autosalvataggio annullato!
cantcreatedir = Impossibile creare car "%s"
failed.location = Non puoi salvare qui.
failed.now = Non puoi salvare in questo momento.
failed.loading = (il gioco sta caricando)
failed.096 = Non puoi fuggire dal tuo destino.
failed.screen = Salvare è permesso solo sui monitor cliccabili sparsi per la struttura.
untitled = senza titolo

[death]
smoke = %s trovato morto in [DATI CANCELLATI]. Causa della morte: Soffocamento dovuto al gas di decontaminazione.
vent = %s trovato morto sotto una grande bocchetta di ventilazione all'ingresso della cella dell'SCP-173. Sembra essere morto quando SCP-173 ha usato la ventilazione per fuggire dall'area.
173.gw = %s. Causa della morte: Frattura cervicale fatale. I nastri di sorveglianza confermano che il soggetto è stato ucciso dall'SCP-173.
173.intro = %s. Causa della morte: Frattura cervicale fatale. Secondo il capo della sicurezza Franklin, presente nella cella di contenimento dell'SCP-173 durante la violazione, il soggetto è stato ucciso dall'SCP-173 non appena sono iniziati i blackout della rete elettrica.
173.6 = "Se non sbaglio, uno degli scopi principali di queste stanze era impedire a SCP-173 di spostarsi ulteriormente in caso di violazione del contenimento. Quindi, di chi è stata la brillante idea di mettere lì dentro un MALEDETTO CONDOTTO DI VENTILAZIONE GRANDE COME UN UOMO?"
173.default = %s. Causa della morte: Frattura cervicale fatale. Si presume sia stato attaccato dall'SCP-173.
106.dimension = %s. Corpo parzialmente decomposto da quello che si presume essere l'effetto “corrosivo” dell'SCP-106. Il corpo è stato smaltito tramite incenerimento.
106.gatea = "L'SCP-106 è stato avvistato nell'area del Gate A, mentre violava il contenimento. Dopo l'uso della torretta a scarica ad alta intensità da parte del personale, l'oggetto è entrato in una dimensione tascabile. La vittima è un (1) membro del personale di Classe D, identificato dagli spettatori come %s, che è anche fuggito dalla struttura e dagli incontri con l'oggetto. L'incidente richiede un'indagine, le procedure di contenimento sono in fase di ripristino."
096 = Una grande quantità di sangue è stata trovata in [DATI CANCELLATI]. Il DNA è stato identificato come quello di %s. Probabilmente [DATI CANCELLATI] dall'SCP-096.
kill_3 = EXCP_ACCESS_VIOLATION
0492 = Tre (3) istanze attive di SCP-049-2 scoperte nel tunnel fuori dalla cella di contenimento dell'SCP-049. Eliminate dalla Nine-Tailed Fox.
049 = Un'istanza attiva di SCP-049-2 è stata scoperta in [DATI CANCELLATI]. Eliminata dalla Nine-Tailed Fox.
0492killed = %s. Causa della morte: lacerazioni multiple e grave trauma da forza contusiva causato da un esemplare di SCP-049-2.
457 = Un corpo gravemente carbonizzato è stato rinvenuto in [DATI CANCELLATI]. I risultati dell'autopsia hanno rivelato la distruzione quasi totale dei tessuti molli e una forte calcinazione scheletrica. Il DNA vitale è stato estratto dalla polpa dentale conservata e identificato come %s. Il danno termico osservato è coerente con l'esposizione diretta a SCP-457.
guard.173 = %s. Causa della morte: Ferita da arma da fuoco alla testa. I nastri di sorveglianza confermano che il soggetto è stato ucciso dall'agente Ulgrin poco dopo l'inizio dell'isolamento dell'area.
guard.gateb = "Agente G. a controllo. Ho eliminato un Classe D in fuga nel giardino del Gate B."
guard.default = %s. Terminato dall'Agente [DATI CANCELLATI].
apache.gateb = "CH-2 a controllo. Abbattuto un Classe D in fuga dal Gate B."
apache.gatea = "CH-2 a controllo. Abbattuto un Classe D in fuga dal Gate A."
035.offices = "Un (1) appendice grande e molto attiva, simile a un tentacolo, sembra essere cresciuta fuori dal cadavere di uno scienziato all'interno dell'area uffici [DATI CANCELLATI]. Il suo livello di aggressività è diverso da qualsiasi cosa abbiamo visto prima: sembra che abbia picchiato a morte qualche sfortunato Classe D durante la violazione."
035.default = "Avremo bisogno di più del normale team di pulizia per occuparci di questo. Due (2) appendici simili a tentacoli, grandi e molto attive, sembrano essersi formate all'interno della cella. Il loro livello di aggressività è diverso da qualsiasi cosa abbiamo visto prima: sembra che abbiano picchiato a morte qualche sfortunato membro dei Classe D durante la violazione."
939 = "Tutti e quattro (4) gli esemplari di SCP-939 fuggiti sono stati catturati e rinchiusi con successo. Hanno combinato un bel disastro nell'Area di Stoccaggio 6. È stata inviata una squadra di pulizia."
1499.dimension = A tutto il personale presente nel rifugio di evacuazione LC-2 durante la violazione sono stati somministrati amnesici di classe B a causa dell'incidente 1499-E. Il soggetto di classe D coinvolto nell'evento è deceduto poco dopo essere stato colpito dall'agente [DATI CANCELLATI].
1499 = Un uomo non identificato e un soggetto di Classe D deceduto sono stati scoperti a [DATI CANCELLATI] dalla Nine-Tailed Fox. L'uomo è stato descritto come molto agitato e sembrava parlare solo russo. È stato portato in un'area di detenzione temporanea a [DATI CANCELLATI] in attesa dell'arrivo di un traduttore.
008 = %s. Causa della morte: lacerazioni multiple e grave trauma da corpo contundente causati da [DATI CANCELLATI], che era infetto da SCP-008. Il soggetto è stato localizzato dalla Nine-Tailed Fox e neutralizzato.
ntf.terminated = %s. Terminato dalla Nine-Tailed Fox.
ntf.gatea = "%s è stato individuato nell'area del Gate A e terminato. L'incidente dovrà essere investigato."
860 = %s è stato visto l'ultima volta mentre entrava in SCP-860-1 senza mai uscire dall'altra parte. Si presume che sia disperso o deceduto in SCP-860-1.
895 = "Quello che sappiamo è che è morto per arresto cardiaco. La mia ipotesi è che sia stato causato dall'SCP-895, anche se non è mai stato osservato prima d'ora che potesse influenzare apparecchiature video da così lontano. Sono necessari ulteriori test per determinare se la 'zona a rischio' dell'SCP-895 si stia espandendo."
895.nvg.914 = "Il Classe D ha osservato l'SCP-895 attraverso un paio di occhiali digitali per la visione notturna, presumibilmente potenziati dall'SCP-914. È possibile che il soggetto sia riuscito a resistere parzialmente agli effetti memetici grazie a questi occhiali. Gli occhiali sono stati conservati per ulteriori studi."
895.nvg.096 = "Il Classe D ha osservato l'SCP-895 attraverso un apparato chiamato ‘Attrezzatura SCRAMBLE', uccidendolo."
ntf.blood = %s. Morto per dissanguamento dopo essere stato colpito dai Nine-Tailed Fox.
895.default = "Avremo bisogno di più del normale team di pulizia per occuparci di questo. Due (2) appendici simili a tentacoli, grandi e molto attive, sembrano essersi formate all'interno della cella. Il loro livello di aggressività è diverso da qualsiasi cosa abbiamo visto prima: sembra che abbiano picchiato a morte un qualche sfortunato membro di Classe D durante la violazione."
895.offices = "Una (1) grande appendice simile a un tentacolo altamente attiva sembra essere cresciuta fuori dal cadavere di uno scienziato all'interno dell'area uffici [DATI CANCELLATI]. Il suo livello di aggressività è diverso da qualsiasi cosa abbiamo visto prima: sembra che abbia picchiato a morte un qualche sfortunato membro di Classe D durante la violazione."
895.nvg = "Il Classe D ha osservato l'SCP-895 attraverso un paio di occhiali digitali per la visione notturna, uccidendolo."
tesla = %s ucciso dal Cancello Tesla presso [DATI CANCELLATI].
door = %s è stato trovato schiacciato tra due porte blindate all'interno di [DATI CANCELLATI].
939.gas = %s è stato trovato morto nell'Area di Stoccaggio 6, soffocato dalla fuga di gas verificatasi durante la violazione. Una squadra di riparazione è stata inviata dopo il contenimento di tutti e quattro (4) gli esemplari di SCP-939.
939.shaft = %s è stato trovato morto all'interno del vano ascensore nell'Area di Stoccaggio 6. Probabilmente il soggetto è finito lì mentre fuggiva da uno degli esemplari di SCP-939. Una squadra di riparazione è stata inviata sul posto dopo che è stato completato il contenimento di tutti e quattro (4) gli esemplari di SCP-939.
966 = %s è stato trovato morto con diverse lacerazioni sul corpo. La causa della morte non è stata specificata.
012 = %s trovato in una pozza di sangue accanto al SCP-012. Il soggetto sembra essersi tagliato i polsi e aver aggiunto tre (3) righe in più al componimento prima di morire per dissanguamento.
035 = Il Classe D %s è stato trovato morto all'interno della cella di contenimento dell'SCP-035. Il soggetto presenta una grave emorragia dei vasi sanguigni intorno agli occhi e all'interno della bocca e del naso. Inviato per l'autopsia.
205 = Il ciclo SCP-205 sembra aver ripreso il suo corso normale dopo le anomalie osservate durante [DATI CANCELLATI]. Il corpo di %s è stato scoperto all'interno della camera. Il soggetto mostra segni di trauma da corpo contundente tipici del personale che è entrato nella camera quando le luci erano spente.
914 = "Un cadavere gravemente mutilato è stato rinvenuto all'interno della cabina di uscita dell'SCP-914. Il test del DNA ha identificato il cadavere come appartenente al Classe D %s. Il soggetto era stato chiaramente ‘raffinato’ da SCP-914 con l'impostazione ‘Rough’, ma non è ancora chiaro come sia finito all'interno della cabina di ingresso e chi o cosa abbia azionato la chiave."
1048a = Un cadavere ricoperto di orecchie è stato rinvenuto in [DATI CANCELLATI]. Si presume che il soggetto sia stato attaccato da un esemplare di SCP-1048-A e sia morto per soffocamento causato dalle orecchie. Il corpo è stato inviato all'autopsia.
1162 = Un soggetto di Classe D è stato trovato morto all'interno della cella di contenimento dell'SCP-1162-ARC. L'autopsia ha rivelato che il suo polmone destro era mancante, il che suggerisce un'interazione con l'SCP-1162-ARC.
106_1 = Oltre all'aspetto decomposto tipico delle vittime dell'SCP-106, il corpo presenta lesioni mai osservate prima: una frattura massiccia del cranio, tre (3) costole rotte, una frattura alla spalla e numerose lacerazioni profonde.
106_2 = Oltre all'aspetto decomposto tipico delle vittime di SCP-106, il soggetto sembra aver subito fratture multiple gravi ad entrambe le gambe.
killbat = %s è stato trovato morto all'interno della cabina di uscita dell'SCP-914 accanto a quella che sembra essere una normale batteria da nove volt. Il soggetto presenta gravi ustioni da elettricità e si presume che sia stato ucciso da una scossa elettrica causata dalla batteria. La batteria è stata conservata per ulteriori studi.
1123 = %s è stato ucciso dopo aver tentato di attaccare un membro dei Nine-Tailed Fox. I video di sorveglianza mostrano che il soggetto aveva vagato nei pressi del sito per circa 9 minuti prima dell'accaduto, gridando in cinese la frase “eliminate i quattro parassiti”. L'SCP-1123 è stato trovato nelle vicinanze di [DATI CANCELLATI], il che suggerisce che il soggetto fosse entrato in contatto fisico con esso.
kill_1 = [DATI CANCELLATI]
kill_2 = %s è stato trovato morto nel Settore [DATI CANCELLATI]. Il soggetto non sembra aver riportato danni fisici e non vi sono indicazioni visibili che possano spiegare la causa della morte. Il corpo è stato inviato per l'autopsia.
kill_4 = %s è stato trovato morto nel Settore [DATI CANCELLATI]. Il soggetto sembra aver scarabocchiato le lettere “kys” con il proprio sangue accanto a sé. Non sono stati riscontrati altri segni di traumi fisici o di lotta. Il corpo è stato inviato per l'autopsia.
superman = Una tuta di classe D rinvenuta in [DATI CANCELLATI]. Da un'ulteriore analisi è emerso che la tuta conteneva 12,5 chilogrammi di una sostanza blu simile alla cenere. L'analisi chimica della sostanza non ha dato risultati conclusivi. Probabilmente correlata all'SCP-914.
joint = %s è stato trovato in stato comatoso a [DATI CANCELLATI]. Il soggetto aveva in mano quella che sembrava essere una sigaretta e sorrideva apertamente. L'analisi chimica della sigaretta non ha dato risultati conclusivi, anche se sembra contenere un'alta concentrazione di una sostanza chimica non identificata la cui struttura molecolare è molto simile a quella del tetraidrocannabinolo.
ringsleep = %s è stato trovato in uno stato comatoso causato da un SCP-714 potenziato prodotto dall'SCP-914. Il soggetto è stato eliminato.
morepower = "Richiesta di supporto da MTF Nu-7. Abbiamo bisogno di più potenza di fuoco per abbattere questa cosa."
0081 = %s è stato trovato mentre ingeriva l'addetto alla manutenzione [DATI CANCELLATI] nel Settore [DATI CANCELLATI]. Il soggetto è stato immediatamente eliminato dalla Nine-Tailed Fox e inviato per l'autopsia. È stata confermata l'infezione da parte di SCP-008, dopodiché il corpo è stato incenerito.
14991 = La posizione dell'SCP-1499 è ancora sconosciuta, ma una squadra di ricognizione è stata inviata per indagare su segnalazioni di un violento attacco a una chiesa nella città russa di [DATI CANCELLATI].
008gate = {0} è stato trovato mentre vagava nei pressi del Gate {1}. Il soggetto è stato immediatamente eliminato dalla Nine-Tailed Fox e il corpo è stato inviato per l'autopsia. È stata confermata l'infezione da parte dell'SCP-008, dopodiché il corpo è stato incenerito.
409 = È stata rinvenuta una pila di cristalli di SCP-409 e, confrontando l'elenco dei deceduti, è stato scoperto che si trattava di %s, il quale ha avuto un contatto fisico con l'SCP-409. I resti sono stati inceneriti insieme alle aree della struttura infestate dai cristalli.
incinerate = %s è stato incenerito al momento dell'ingresso nell'inceneritore mentre era infetto da SCP-409. Le ceneri sono state rimosse insieme all'incenerimento delle aree della cella infestate dai cristalli.
1025 = "È morto per arresto cardiaco dopo aver letto SCP-1025, questo è certo. Esiste qualcosa come l'arresto cardiaco psicosomatico, oppure SCP-1025 ha alcune proprietà anomale di cui non siamo ancora a conoscenza?"
009_1 = "Un soggetto cristallizzato di Classe D è stato rinvenuto dal team di manutenzione inviato a riparare la camera di contenimento dell'SCP-009. Il corpo è attualmente non identificabile a causa dei gravi danni causati dalla sostanza."
009_2 = "Un soggetto cristallizzato di Classe D è stato rinvenuto nei pressi della camera di contenimento dell'SCP-009. Il corpo è attualmente non identificabile a causa dei gravi danni causati dalla sostanza."
009_3 = "Abbiamo trovato un %s cristallizzato. Morte causata dall'esposizione a SCP-009. Non è noto come il soggetto abbia raggiunto [DATI CANCELLATI] prima della contaminazione totale."
513 = Il soggetto D-9341 è stato trovato morto in una pozza di sangue presso [DATI CANCELLATI], con emorragia dalle orecchie dovuta alla rottura dei timpani. L'SCP-513 è stato rinvenuto vicino al corpo, apparentemente dopo essere stato raffinato utilizzando SCP-914. SCP-513 è stato immediatamente contenuto in gelatina dalla Task Force Mobile intervenuta sul posto per prevenire ulteriori incidenti di natura simile.
457_2 = "Il contenimento di SCP-457 è stato ripristinato con successo dai Nine-Tailed Fox. Le squadre di riparazione sono state inviate nei tunnel di manutenzione. Sono stati recuperati diversi corpi carbonizzati. L'identificazione è in corso."

[msg]
refresh = AGGIORNAMENTO DEI DATI FRA %s SECONDI
scramble.106.cont = SCP-106 CONTENUTO!
scramble.106.arr = %s METRI PRIMA DELL'ARRIVO DELL'SCP-106!
achv.unlocked = Achievement Sbloccato - %s
diff.safe = Consigliato per i novizi. Il gioco può essere salvato in qualsiasi momento. Tuttavia, come nel caso degli oggetti SCP, una classificazione "sicura" non significa che la sua manipolazione non comporti alcun pericolo.
diff.euclid = Nella difficoltà Euclid, è possibile salvare solo in luoghi specifici contrassegnati da schermi di computer illuminati. Gli SCP di classe Euclid sono intrinsecamente imprevedibili, quindi non è sempre possibile un contenimento affidabile.
diff.keter = Gli SCP di classe Keter sono anomalie incredibilmente difficili da contenere in maniera coerente e affidabile. Lo stesso vale per questo livello di difficoltà: gli SCP sono più aggressivi e hai solo una vita - quando muori, il gioco finisce.
diff.apollyon = Gli SCP di classe Apollyon sono completamente impossibili da contenere o stanno per violare irrevocabilmente il contenimento, con conseguenze inimmaginabili. Dio aiuti l'umile soggetto che tenta questa impresa.
paper = Premi il Tasto Sinistro del mouse per raccogliere gli oggetti. Raccogli il foglio sulla scrivania.
openinv = Premi %s per aprire l'inventario.
failed.openinv = Non puoi aprire l'inventario in questo momento.
doc.read = Leggi il documento.
item.select = Fai doppio clic sull'oggetto per utilizzarlo.
item.deselect = Clicca con il tasto destro del mouse per deselezionare l'oggetto.
item.drop = Rilascia l'oggetto trascinandone l'icona fuori dall'inventario.
right.click = Premendo il tasto destro del mouse invece del sinistro, è possibile rilasciare gli oggetti senza chiudere l'inventario.
item.combine.swap = Sovrapponendo le icone dell'inventario, è possibile scambiare o combinare determinati oggetti.
enterchmbr = Entra nella cella del test.
leavechmbr = Lascia rapidamente la cella!
blink = Premi %s per chiudere gli occhi.
run = Tieni premuto %s per correre.
crouch = Premi %s per accovacciarti.
move = Tieni premuto %s per muoverti. Lascia la cella.
bat.combine = Combina la batteria con il dispositivo per farlo funzionare.
294.another = È necessario inserire un'altra Moneta per poter utilizzare questa macchina.
294.two = Per utilizzare questa macchina è necessario inserire una Mastercard o due monete.
294.funds = Non disponi di fondi sufficienti per utilizzare questa macchina.
refill = Hai riempito il tuo bicchiere vuoto con dell'acqua.
cup.unknown = Cavolo... Questa bevanda non esiste. Come hai fatto a procurartela?
cup.needed = Per utilizzare questa macchina è necessario un bicchiere vuoto.
999_follow = L'SCP-999 non è più in grado di seguire.
cantcarry = Non puoi trasportare altri oggetti.
012_1 = Inizi a spingere le unghie nel polso, fino a sanguinare.
012_2 = Ti laceri il polso sinistro e inizi a scrivere sul foglio con il tuo sangue.
012_3 = Spingi le dita più a fondo nella ferita.
012_4 = Hai aperto la ferita. Afferri manciate di sangue mentre sgorga.
008.173 = La finestra si è frantumata e un pezzo di vetro ti ha tagliato il braccio.
914 = Noti innumerevoli piccole incisioni su tutto il corpo. Sanguinano copiosamente.
1048a_1 = Qualcosa sta crescendo su tutto il tuo corpo.
1048a_2 = Ti stanno spuntando orecchie su tutto il corpo.
1048a_3 = Organi simili a orecchie stanno crescendo su tutto il tuo corpo.
1048a_4 = Delle orecchie ti stanno crescendo su tutto il corpo. Ti strisciano sulla pelle.
1048a_5 = Sta diventando difficile respirare.
1048a_6 = Ora hai un udito eccellente. Inoltre, stai morendo.
1048a_7 = Le orecchie stanno crescendo dentro il tuo corpo.
1048a_8 = "Non riesco... a respirare..."
1048a_rev1 = Le orecchie iniziano a cadere dal tuo corpo.
1162_1 = Senti un improvviso dolore lancinante al petto.
1162_2 = Senti qualcosa muoversi nelle tasche e provi un improvviso dolore al petto.
breeze = Senti una brezza fredda accanto al tuo corpo.
duck = Hai strizzato la normale paperella di gomma.
flamingo = Hai strizzato il normale fenicottero di gomma.
coinflip_1 = Lanci la moneta.
coinflip_2 = Esce testa.
970.item.missing = Senti qualcosa che si muove nelle tue tasche.
970.sharp = Un dolore acuto ti attraversa le gambe.
409 = Hai toccato l'SCP-409.
409.nothappened = Hai toccato l'SCP-409, ma non è successo nulla.
458 = Prendi una fetta di SCP-458.
pizza = Mangi la fetta di pizza. È la pizza più buona che tu abbia mai mangiato.
vfvest = Il giubbotto è troppo pesante per essere sollevato.
corrvest = “Non lo prenderò!”
twovest = Non è possibile indossare due giubbotti contemporaneamente.
twosuit = Non è possibile indossare due tute protettive contemporaneamente.
vestsuit = Non è possibile indossare contemporaneamente un giubbotto e una tuta protettiva.
drop.suit = Non è possibile rilasciare alcun oggetto mentre si indossa una tuta protettiva.
mask.use = Non è possibile utilizzare quell'oggetto mentre si indossa una maschera antigas.
gear.use = Non puoi usare quell'oggetto mentre indossi un copricapo.
mask.use.off = È necessario togliere la maschera antigas per poter utilizzare quell'oggetto.
1499.use.off = È necessario rimuovere l'SCP-1499 per poter utilizzare quell'oggetto.
goggle.use.off = È necessario togliere gli occhiali per poter utilizzare quell'oggetto.
helmet.use.off = È necessario togliere il casco per poter utilizzare quell'oggetto.
gear.use.off = È necessario togliere l'attrezzatura per poter utilizzare quell'oggetto.
suit.use.off = È necessario togliere la tuta protettiva per poter utilizzare quell'oggetto.
cap.use.off = È necessario rimuovere il cappello per poter utilizzare quell'oggetto.
weartwo.headphones = Non è possibile indossarne due paia contemporaneamente.
weartwo.gas = Non è possibile indossare due maschere antigas contemporaneamente.
