codes_5 = Ufficio del Consiglio O5: %s
help.camerafog = Imposta la distanza di rendering della nebbia.\nLa nebbia inizia a generarsi a una distanza di 0,1 unità\ndalla telecamera e diventa completamente opaca\na una distanza di 'CameraFogFar' unità dalla telecamera.\nEsempio: camerafog 40
help.noclip = Attiva/disattiva NoClip, a meno che non sia specificato\nun parametro valido (sì/no).\nConsente alla telecamera di muoversi in qualsiasi direzione\nevitando le collisioni.
help.noblink = Attiva/disattiva il NoBlink, a meno che non sia specificato\nun parametro valido (sì/no).\nElimina la chiusura degli occhi del giocatore.
help.god = Attiva/disattiva la GodMode, a meno che non sia specificato\nun parametro valido (sì/no).\nImpedisce la morte del giocatore in circostanze normali.
help.is = Attiva/disattiva InfiniteStamina, a meno che non sia specificato\nun parametro valido (sì/no).\nAumenta la resistenza del giocatore a un valore infinito.
help.nt = Attiva/disattiva NoTarget, a meno che non sia specificato\nun parametro valido (sì/no).\nRende il giocatore invisibile ai PNG.
help.wf = Attiva/disattiva il Wireframe, a meno che non sia specificato\nun parametro valido (sì/no).\nConsente di renderizzare solo i bordi della geometria,\nrendendo trasparente tutto il resto.
help.si = Genera un oggetto alla posizione del giocatore.\nQualsiasi nome che può apparire nel tuo inventario\nè un parametro valido.\nEsempio: spawnitem Key Card Omni
help.sd = Genera un bicchiere con un liquido proveniente da SCP-294 alla posizione del giocatore.\nQualsiasi nome che può apparire nel tuo inventario\nè un parametro valido.\nEsempio: spawndrink WATER
help.s = Genera un PNG alla posizione del giocatore.\nI parametri validi sono:\n008-1 chirurgo / 008-1 / 049 / 049-2 / 066 / 096 / 106 / 173 / 860-2\n/ 372 / 457 / 513-1 / 966 / 999 / 1499-1 / 939 / 1048 / 1048-a\n/ classe-d / apache / guardia / mtf / tentacolo
help.dc = Attiva/disattiva la leva del Comando Remoto della Porta.
help.revive = Ripristina il timer di morte del giocatore dopo l'attivazione\ndell'animazione di morte.
help.teleport = Teletrasporta il giocatore alla prima istanza\ndella stanza specificata. Qualsiasi stanza che appare\nin rooms.ini è un parametro valido.
